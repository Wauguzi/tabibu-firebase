name: prod_apk

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main

# The release notes read the pull request's commits, which needs pull-requests: read.
permissions:
  contents: read
  pull-requests: read

jobs:
  # The functions' lint, build and full type-check, the seed included. Their emulator tests
  # need Java and firebase-tools, so they stay local (make functions-test, make rules-test).
  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🟢 Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔬 Lint
        run: npm run lint

      - name: 🏗️ Build
        run: npm run build

      - name: 🧾 Type-check everything, tests and seed included
        run: npx tsc --noEmit -p tsconfig.json

  build:
    # Pinned: on the newer Ubuntu image Gradle was killed mid-build (exit 143).
    runs-on: ubuntu-24.04
    # The tests take about 28 minutes and a cold signed release build about 15.
    timeout-minutes: 60
    env:
      # Empty for Dependabot and fork PRs, which receive no secrets; the signed steps skip.
      CAN_SIGN: ${{ secrets.RELEASE_KEYSTORE != '' }}
      FIREBASE_ANDROID_APP_ID: "1:270369739916:android:488605da76eaf0aa7f17a9"
    steps:
      - name: 🧹 Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          preinstalled-runtimes: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # The step above deletes the runner's swap. Give the release build (Gradle, the Kotlin
      # daemon, R8, gen_snapshot) 8 GB of headroom instead of an OOM kill.
      - name: 💾 Add swap
        run: |
          sudo fallocate -l 8G /swapfile-ci
          sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci
          sudo swapon /swapfile-ci
          free -h

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: "17"
          distribution: "temurin"

      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags come with the checkout, which holds the token; a later git fetch
          # has no credentials to read a private repository with.
          fetch-tags: true
          persist-credentials: false

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # The version the branch was verified on; a newer 3.x released on the day must not
          # fail a pull request for reasons unrelated to it.
          flutter-version: "3.50.0"
          cache: true

      - name: 🔍 Flutter version
        run: flutter --version

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🌐 Generate localization files
        run: flutter gen-l10n

      - name: 🎨 Format check
        run: >
          find lib test -type f -name "*.dart"
          ! -path "lib/l10n/gen/*" ! -path "lib/gen/*" ! -name "firebase_options.dart" -print0
          | xargs -0 dart format --set-exit-if-changed -o none

      - name: ⚙️ Code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 🔬 Analyze
        run: flutter analyze lib test

      - name: 🧱 Bloc lint
        run: |
          dart pub global activate bloc_tools
          dart pub global run bloc_tools:bloc lint .

      - name: 🧪 Run unit and widget tests
        run: flutter test --coverage

      # The release script runs only on a merge, so its checks run here, before one.
      - name: 🏷️ Release script checks
        run: node --test scripts/*.test.cjs

      # The merge drafts its release from pubspec.yaml and refuses a version that is not past the
      # latest release, so a missing bump blocks the merge here instead of failing after it. The
      # script reads the tags the checkout fetched. Dependabot does not bump the version, so its
      # pull requests skip.
      - name: 🔢 Version bumped past the latest release
        if: github.actor != 'dependabot[bot]'
        run: node scripts/next-release.cjs

      - name: 🔑 Decode Android keystore
        if: env.CAN_SIGN == 'true'
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          echo "$RELEASE_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # gradle.properties asks for an 8 GB heap, which starves the OS, the Kotlin daemon and the
      # compilers on a hosted runner and ends in an OOM kill (exit 143).
      - name: 🧠 Tune Gradle for hosted runner memory
        if: env.CAN_SIGN == 'true'
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8/' android/gradle.properties
          if grep -q '^org.gradle.parallel=' android/gradle.properties; then
            sed -i 's/^org.gradle.parallel=.*/org.gradle.parallel=false/' android/gradle.properties
          else
            echo 'org.gradle.parallel=false' >> android/gradle.properties
          fi
          if ! grep -q '^org.gradle.workers.max=' android/gradle.properties; then
            echo 'org.gradle.workers.max=2' >> android/gradle.properties
          fi
          if ! grep -q '^kotlin.daemon.jvmargs=' android/gradle.properties; then
            echo 'kotlin.daemon.jvmargs=-Xmx1024m' >> android/gradle.properties
          fi

      - name: 🏗️ Build release APK
        if: env.CAN_SIGN == 'true'
        env:
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD }}
        run: >
          flutter build apk
          --flavor production
          --release
          --target lib/main_production.dart
          --obfuscate
          --split-debug-info=debug-symbols

      - name: 📦 Upload debug symbols
        if: env.CAN_SIGN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-symbols-${{ github.run_number }}
          path: debug-symbols/
          retention-days: 90

      - name: 🔥 Upload Dart symbols to Crashlytics
        if: env.CAN_SIGN == 'true'
        env:
          CREDENTIAL_FILE_CONTENT: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
        run: |
          printf '%s' "$CREDENTIAL_FILE_CONTENT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@15.31.0 crashlytics:symbols:upload \
            --app "$FIREBASE_ANDROID_APP_ID" debug-symbols/

      # Without notes the action sends `git log -1`, which on a pull request is GitHub's synthetic
      # merge commit. Testers get the pull request and its commits instead. Titles and messages
      # are the contributor's text, so they reach the file through env and jq, never the shell.
      # App Distribution caps notes at 16,000 characters.
      - name: 📝 Release notes from the pull request
        if: env.CAN_SIGN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)
          {
            printf 'Tabibu %s\n' "$version"
            printf 'PR #%s: %s\n\n' "$PR_NUMBER" "$PR_TITLE"
            printf 'Commits:\n'
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits" \
              --jq '.[] | select(.parents | length < 2)
                    | "- " + (.commit.message | split("\n")[0]) + " (" + .sha[0:7] + ")"'
          } > release-notes.txt
          head -c 16000 release-notes.txt > release-notes.capped.txt
          mv release-notes.capped.txt release-notes.txt
          cat release-notes.txt

      - name: 🚀 Upload to Firebase App Distribution
        if: env.CAN_SIGN == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@bd494989dd4bec0343f78adee87fe66e48279ad6 # v1.7.1
        with:
          appId: ${{ env.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: internal-production
          file: build/app/outputs/flutter-apk/app-production-release.apk
          releaseNotesFile: release-notes.txt

      - name: 🧽 Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/service-account.json"
